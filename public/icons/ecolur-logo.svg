<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Brand Two-Tone Green Palette -->
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3708" />
      <stop offset="50%" stop-color="#28430a" />
      <stop offset="100%" stop-color="#3b610e" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Eco Badge -->
  <circle cx="100" cy="100" r="94" fill="url(#ecoBg)" stroke="#507b00" stroke-width="4" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#95c22b" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Eco Leaf Laurel Wreath (Outer Ring Accent) -->
  <g fill="#95c22b" opacity="0.35">
    <path d="M30,75 C24,65 24,50 32,42 C32,54 36,66 30,75 Z" />
    <path d="M24,95 C18,85 20,70 28,64 C27,76 30,87 24,95 Z" />
    <path d="M25,115 C20,105 24,90 32,86 C29,98 31,109 25,115 Z" />
    <path d="M170,75 C176,65 176,50 168,42 C168,54 164,66 170,75 Z" />
    <path d="M176,95 C182,85 180,70 172,64 C173,76 170,87 176,95 Z" />
    <path d="M175,115 C180,105 176,90 168,86 C171,98 169,109 175,115 Z" />
  </g>

  <!-- Inner Shield Base -->
  <path d="M100,28 C135,28 152,42 150,85 C148,125 118,155 100,165 C82,155 52,125 50,85 C48,42 65,28 100,28 Z" fill="#ffffff" />
  <path d="M100,34 C130,34 145,46 144,85 C142,120 115,148 100,158 C85,148 58,120 56,85 C55,46 70,34 100,34 Z" fill="#28430a" />

  <!-- Pak Eko Two-Tone Minimalist Silhouette -->
  <!-- Beret -->
  <path d="M72,65 C72,50 82,42 104,42 C125,42 135,49 133,60 C125,64 115,65 100,65 C84,65 76,64 72,65 Z" fill="#ffffff" />
  <circle cx="94" cy="52" r="3.5" fill="#28430a" />

  <!-- Head / Face Silhouette -->
  <path d="M84,65 C84,60 92,57 100,57 C108,57 116,60 116,65 C116,77 108,86 100,86 C92,86 84,77 84,65 Z" fill="#ffffff" />
  <!-- Minimalist Smile -->
  <path d="M92,72 C96,77 104,77 108,72" stroke="#28430a" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Uniform Neck & Collar -->
  <path d="M91,84 L100,94 L109,84 L118,88 L114,102 L86,102 L82,88 Z" fill="#ffffff" />

  <!-- Body / Torso Uniform -->
  <path d="M72,100 L128,100 L132,155 C122,158 110,160 100,160 C90,160 78,158 68,155 Z" fill="#ffffff" />
  <!-- Center Placket & Tie / Strap -->
  <path d="M98,100 L98,158 L102,158 L102,100 Z" fill="#28430a" />
  <path d="M86,100 L114,145 L108,148 L80,103 Z" fill="#28430a" />

  <!-- Double Thumbs Up Hands (Left & Right) -->
  <!-- Left Hand Thumbs Up -->
  <g fill="#ffffff" stroke="#28430a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M64,96 C64,83 67,74 72,74 C76,74 77,80 77,88 L77,98" fill="#ffffff" />
    <rect x="58" y="96" width="22" height="24" rx="7" fill="#ffffff" />
  </g>

  <!-- Right Hand Thumbs Up -->
  <g fill="#ffffff" stroke="#28430a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M136,96 C136,83 133,74 128,74 C124,74 123,80 123,88 L123,98" fill="#ffffff" />
    <rect x="120" y="96" width="22" height="24" rx="7" fill="#ffffff" />
  </g>

  <!-- Name Tag 'EKO' -->
  <rect x="80" y="112" width="16" height="6" rx="1.5" fill="#28430a" />
  <text x="88" y="116.5" fill="#ffffff" font-size="4" font-family="monospace" font-weight="900" text-anchor="middle">EKO</text>

  <!-- Renewable Energy Spark / Leaves on Bottom -->
  <polygon points="100,166 94,177 101,177 98,188 107,175 101,175" fill="#95c22b" />
</svg>
